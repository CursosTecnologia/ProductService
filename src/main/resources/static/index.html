<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

<div class="card p-4 shadow-sm mb-4">
    <h4>Agregar Nuevo Producto</h4>
    <div class="row g-2">
        <div class="col-md-3">
            <input type="text" id="newName" class="form-control" placeholder="Nombre">
        </div>
        <div class="col-md-4">
            <input type="text" id="newDesc" class="form-control" placeholder="Descripción">
        </div>
        <div class="col-md-2">
            <input type="number" id="newPrice" class="form-control" placeholder="Precio">
        </div>
        <div class="col-md-3">
            <button class="btn btn-success w-100" onclick="agregarProducto()">Agregar Producto</button>
        </div>
    </div>
</div>

<div class="card p-4 shadow-sm">
    <h2 class="mb-4">Buscador de Productos</h2>

    <div class="input-group mb-3">
        <input type="text" id="inputNombre" class="form-control" placeholder="Nombre del producto...">
        <button class="btn btn-primary" onclick="buscar()">Buscar</button>
        <button class="btn btn-outline-secondary btn-sm" onclick="cargarTodos()">Actualizar Todo</button>
    </div>

    <table class="table table-hover mt-3">
        <thead class="table-light">
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Descripción</th>
            <th>Precio</th>
        </tr>
        </thead>
        <tbody id="tablaCuerpo">
        </tbody>
    </table>
</div>

<script src="js/app.js"></script>
</body>
</html>
